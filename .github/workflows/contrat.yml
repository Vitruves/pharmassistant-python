name: Contrat de l'API

# Chaque lundi : le paquet face au schéma OpenAPI de l'API en service.
# Rouge = l'API a évolué, le paquet doit suivre.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrat:
    name: Schéma OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Test de contrat
        working-directory: tests
        env:
          PHARMASSISTANT_CONTRAT: "1"
        run: uv run --no-project --with .. python -m unittest test_contrat -v
